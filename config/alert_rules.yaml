alerts:
  - name: HighLatencyP95
    severity: critical
    condition: "latency_p95_ms > 3000 for 5m"
    type: symptom-based
    owner: On-Call Observability Team
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2.0 for 3m"
    type: symptom-based
    owner: On-Call API Team
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: warning
    condition: "quality_score_avg < 0.75 for 10m"
    type: symptom-based
    owner: AI Agent Team
    runbook: docs/alerts.md#alert-3
